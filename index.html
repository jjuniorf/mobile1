<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Reelix · Movies &amp; TV</title>
<style>
/* ================= BASE ================= */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:#050507;color:#f6f6f8;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;color:inherit;padding:0}
img{display:block}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}

:root{
  --bg:#08080b;--surface:#121218;--surface2:#1b1b24;
  --line:rgba(255,255,255,.08);--text:#f6f6f8;--muted:#8b8b9a;
  --accent:#ff3b5c;
  --gold:#4ade80;          /* ← rating color: now green */
  --rating:#4ade80;        /* alias for clarity */
}

.app{
  max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--bg);position:relative;overflow-x:hidden;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
}

/* ================= LOADING SCREEN ================= */
.loading-screen{
  position:fixed;inset:0;z-index:99999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;text-align:center;
  background:
    radial-gradient(circle at 50% 42%, #1c1022 0%, #0a0a10 48%, #050507 100%);
  overflow:hidden;touch-action:none;
  transition:opacity .55s cubic-bezier(.4,0,.2,1),visibility .55s;
}
.loading-screen.done{opacity:0;visibility:hidden;pointer-events:none}

.loading-glow{
  position:absolute;top:50%;left:50%;
  width:420px;height:420px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,59,92,.28) 0%,rgba(255,59,92,0) 65%);
  filter:blur(30px);pointer-events:none;
  animation:glowPulse 3s ease-in-out infinite;
}
@keyframes glowPulse{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6}
  50%{transform:translate(-50%,-50%) scale(1.18);opacity:1}
}

.loading-logo{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  animation:logoIn .85s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes logoIn{
  from{opacity:0;transform:translateY(24px) scale(.9)}
  to{opacity:1;transform:none}
}

.loading-mark{
  width:82px;height:82px;border-radius:24px;
  display:grid;place-items:center;position:relative;
  font-size:38px;font-weight:900;color:#fff;letter-spacing:-1px;
  background:linear-gradient(140deg,#ff3b5c 0%,#ff6e85 55%,#ff8fa3 100%);
  box-shadow:
    0 20px 50px rgba(255,59,92,.45),
    0 4px 12px rgba(0,0,0,.5),
    inset 0 2px 5px rgba(255,255,255,.35);
  animation:markBob 2.4s ease-in-out infinite;
}
@keyframes markBob{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-4px) scale(1.035)}
}
.loading-mark::before{
  content:"";position:absolute;inset:-10px;border-radius:32px;
  border:2px solid transparent;
  border-top-color:rgba(255,255,255,.7);
  border-right-color:rgba(255,59,92,.4);
  animation:ringSpin 1.5s linear infinite;
}
@keyframes ringSpin{to{transform:rotate(360deg)}}

.loading-brand{
  margin-top:24px;
  font-size:34px;font-weight:900;letter-spacing:7px;line-height:1;
  background:linear-gradient(94deg,#ffffff 0%,#ffb3c0 45%,#ff3b5c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 14px rgba(255,59,92,.35));
}

.loading-tagline{
  margin-top:11px;
  font-size:10.5px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;
  color:#7a7a8a;
  opacity:0;transform:translateY(6px);
  animation:fadeUp .55s ease .35s forwards;
}
@keyframes fadeUp{to{opacity:1;transform:none}}

.loading-bar{
  position:relative;z-index:2;
  width:210px;height:3px;border-radius:999px;
  background:rgba(255,255,255,.07);
  overflow:hidden;margin-top:38px;
  opacity:0;transform:translateY(6px);
  animation:fadeUp .55s ease .45s forwards;
}
.loading-bar-fill{
  height:100%;width:0%;border-radius:inherit;
  background:linear-gradient(90deg,#ff3b5c 0%,#ff8fa3 100%);
  box-shadow:0 0 14px rgba(255,59,92,.75);
  transition:width .55s cubic-bezier(.3,.7,.4,1);
}

.loading-status{
  position:relative;z-index:2;
  margin-top:16px;min-height:14px;
  font-size:10.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:#6e6e7d;
  opacity:0;transform:translateY(6px);
  animation:fadeUp .55s ease .55s forwards;
  transition:color .3s ease;
}
.loading-status.ready{color:#7ce2a8}

/* ================= VIEWS ================= */
.view{display:none}
.view.active{display:block;animation:viewIn .38s cubic-bezier(.22,.61,.36,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ================= TOPBAR ================= */
.topbar{
  position:absolute;top:0;left:0;right:0;z-index:6;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px;
  pointer-events:none;
}
.topbar>*{pointer-events:auto}
.brand{
  font-size:19px;font-weight:900;letter-spacing:2.5px;
  background:linear-gradient(92deg,#fff,#ff8fa3 60%,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.avatar{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,#3a3a4d,#1c1c26);
  border:1px solid rgba(255,255,255,.14);font-size:13px;font-weight:700;color:#fff;
}

/* ================= HERO ================= */
.hero{position:relative;height:78vh;max-height:620px;min-height:460px;overflow:hidden;background:#101017}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,
    rgba(8,8,11,.92) 0%,rgba(8,8,11,.35) 22%,rgba(8,8,11,0) 42%,
    rgba(8,8,11,.55) 64%,rgba(8,8,11,.94) 86%,var(--bg) 100%);
}
.hero-body{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 18px 22px}
.hero-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:#ffd9e0;background:rgba(255,59,92,.16);
  border:1px solid rgba(255,59,92,.35);
  padding:5px 10px;border-radius:999px;margin-bottom:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.hero h1{
  margin:0 0 8px;font-size:32px;line-height:1.06;font-weight:850;letter-spacing:-1px;
  text-shadow:0 2px 20px rgba(0,0,0,.6);
}
.hero-meta{font-size:12.5px;color:#c9c9d4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.hero-meta .dot{width:3px;height:3px;border-radius:50%;background:#6d6d7c}
.hero-meta .star{color:var(--rating);font-weight:700}
.hero-actions{display:flex;gap:10px;align-items:center}

.btn-main{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:#fff;color:#000;border-radius:999px;padding:13px 22px;
  font-size:14px;font-weight:750;letter-spacing:-.2px;
  transition:transform .16s ease,opacity .16s ease;
  box-shadow:0 8px 24px rgba(255,255,255,.14);
}
.btn-main:active{transform:scale(.95);opacity:.9}
.btn-main svg{width:16px;height:16px;fill:#000}
.btn-round{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .16s ease,background .2s;
}
.btn-round:active{transform:scale(.9);background:rgba(255,255,255,.22)}
.btn-round svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-round.on{background:rgba(255,59,92,.22);border-color:rgba(255,59,92,.5)}
.btn-round.on svg{fill:var(--accent);stroke:var(--accent)}

/* ================= ROWS ================= */
.row{margin-top:26px}
.row-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 18px 12px}
.row-head h3{margin:0;font-size:16.5px;font-weight:750;letter-spacing:-.35px}
.row-head span{font-size:12px;color:var(--muted);font-weight:600}
.hscroll{
  display:flex;gap:11px;overflow-x:auto;padding:2px 18px 6px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
}
.hscroll .card{flex:0 0 auto;width:118px;scroll-snap-align:start}

/* ================= CARD ================= */
.card{display:block;text-align:left;width:100%;transition:transform .17s cubic-bezier(.3,.7,.4,1)}
.card:active{transform:scale(.955)}
.poster{
  position:relative;width:100%;aspect-ratio:2/3;border-radius:13px;overflow:hidden;
  background:linear-gradient(135deg,#232330,#14141c);
  box-shadow:0 6px 18px rgba(0,0,0,.45);
}
.poster .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;opacity:.22}
.poster img{position:relative;width:100%;height:100%;object-fit:cover}
.rate{
  position:absolute;left:6px;top:6px;font-size:9.5px;font-weight:800;letter-spacing:.2px;
  padding:3px 6px;border-radius:6px;
  color:var(--rating);                     /* ← green rating badge text */
  background:rgba(0,0,0,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.fav-mark{
  position:absolute;right:6px;top:6px;width:18px;height:18px;border-radius:50%;
  display:grid;place-items:center;font-size:9px;color:#fff;
  background:rgba(255,59,92,.92);box-shadow:0 2px 8px rgba(255,59,92,.5);
}
.c-title{
  margin-top:8px;font-size:12px;font-weight:650;line-height:1.28;letter-spacing:-.1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.c-meta{margin-top:3px;font-size:10.5px;color:var(--muted);font-weight:500}

/* ================= GRID ================= */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;padding:0 18px 6px}

/* ================= SENTINEL ================= */
.sentinel{
  min-height:52px;display:flex;align-items:center;justify-content:center;
  padding:14px 18px 30px;width:100%;
}
.end-note{
  font-size:12px;color:var(--muted);font-weight:600;text-align:center;
  padding:4px 0;letter-spacing:.1px;
}
.retry-btn{
  font-size:12.5px;font-weight:700;color:#fff;
  background:var(--surface2);border:1px solid var(--line);
  padding:10px 22px;border-radius:999px;transition:transform .15s ease;
}
.retry-btn:active{transform:scale(.95)}

/* ================= PAGE HEAD ================= */
.page-head{padding:calc(20px + env(safe-area-inset-top)) 18px 16px}
.page-head h1{margin:0;font-size:27px;font-weight:850;letter-spacing:-.9px}
.page-head p{margin:5px 0 0;font-size:13px;color:var(--muted);font-weight:500}

/* ================= CHIPS ================= */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 18px 16px}
.chip{
  flex:0 0 auto;padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:650;
  background:var(--surface);color:var(--muted);
  border:1px solid var(--line);
  transition:transform .16s ease,background .22s ease,color .22s ease,border-color .22s ease;
}
.chip:active{transform:scale(.94)}
.chip.active{background:#fff;color:#0a0a0d;border-color:#fff}

/* ================= SEARCH ================= */
.search-wrap{padding:0 18px 16px}
.search-box{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:15px;padding:13px 15px;
  transition:border-color .25s,background .25s;
}
.search-box:focus-within{border-color:rgba(255,255,255,.22);background:var(--surface2)}
.search-box svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;flex:0 0 auto}
.search-box input{
  flex:1;background:none;border:0;outline:0;color:var(--text);
  font-size:15px;font-weight:500;font-family:inherit;min-width:0;
}
.search-box input::placeholder{color:#666675}
.clear-btn{font-size:17px;color:var(--muted);padding:0 2px;line-height:1}

/* ================= EMPTY / ERRORS ================= */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:56px 30px;text-align:center;gap:8px;
}
.empty .ico{font-size:36px;opacity:.35;margin-bottom:6px}
.empty h4{margin:0;font-size:15px;font-weight:700}
.empty p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}

/* ================= SKELETON ================= */
.sk-poster{
  width:100%;aspect-ratio:2/3;border-radius:13px;
  background:linear-gradient(100deg,#16161e 30%,#23232f 50%,#16161e 70%);
  background-size:200% 100%;animation:shimmer 1.3s infinite;
}
.sk-line{
  height:9px;border-radius:5px;margin-top:8px;
  background:linear-gradient(100deg,#16161e 30%,#23232f 50%,#16161e 70%);
  background-size:200% 100%;animation:shimmer 1.3s infinite;
}
.sk-line.short{width:60%}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.hero-skeleton{
  height:78vh;max-height:620px;min-height:460px;
  background:linear-gradient(100deg,#101017 30%,#1b1b24 50%,#101017 70%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;
}
.spinner{
  width:30px;height:30px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.15);border-top-color:#fff;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.sheet-loading{display:grid;place-items:center;height:60vh}

/* ================= TABBAR ================= */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:70;
  display:flex;align-items:stretch;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  background:rgba(10,10,14,.82);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--line);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 0 4px;color:#6e6e7d;font-size:9.5px;font-weight:700;
  letter-spacing:.2px;transition:color .25s ease;
}
.tab svg{
  width:23px;height:23px;stroke:currentColor;fill:none;
  stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .32s cubic-bezier(.34,1.56,.64,1),color .25s;
}
.tab.active{color:var(--text)}
.tab.active svg{stroke:var(--accent);transform:translateY(-2px) scale(1.07)}
.tab:active svg{transform:scale(.88)}

/* ================= DETAIL SHEET ================= */
.sheet{
  position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:480px;z-index:100;
  background:var(--bg);overflow:hidden;
  transform:translate(-50%,100%);
  transition:transform .44s cubic-bezier(.32,.72,0,1);
  visibility:hidden;
}
.sheet.open{transform:translate(-50%,0);visibility:visible}
.sheet-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-close{
  position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:9;
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.16);
}
.sheet-close svg{width:16px;height:16px;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.sheet-hero{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#101017}
.sheet-hero img{width:100%;height:100%;object-fit:cover}
.sheet-hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(8,8,11,.55) 0%,rgba(8,8,11,0) 40%,rgba(8,8,11,.7) 78%,var(--bg) 100%);
}
.sheet-body{padding:0 18px 44px;margin-top:-46px;position:relative;z-index:2}
.sheet-body h2{margin:0 0 10px;font-size:26px;font-weight:850;letter-spacing:-.8px;line-height:1.12}
.meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.meta-row .pill{
  font-size:11.5px;font-weight:700;color:#cfcfdb;
  background:var(--surface2);border:1px solid var(--line);
  padding:5px 10px;border-radius:8px;
}
.meta-row .pill.gold{color:var(--rating)}   /* ← green rating pill */
.genres{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.genres span{
  font-size:11.5px;font-weight:650;color:#c2c2d0;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  padding:5px 11px;border-radius:999px;
}
.desc{font-size:13.5px;line-height:1.62;color:#b6b6c4;margin:0 0 20px;font-weight:450}
.sheet-actions{display:flex;gap:10px;margin-bottom:16px}
.sheet-actions .btn-main{flex:1;padding:15px 20px;font-size:14.5px}
.sheet-actions .btn-round{width:52px;height:52px;flex:0 0 auto;background:var(--surface2);border-color:var(--line)}
.sheet-actions .btn-round svg{stroke:#fff}
.sheet-actions .btn-round.on{background:rgba(255,59,92,.18);border-color:rgba(255,59,92,.45)}
.sheet-actions .btn-round.on svg{fill:var(--accent);stroke:var(--accent)}
.more-h{font-size:15.5px;font-weight:750;letter-spacing:-.3px;margin:0 0 12px}

/* ================= INLINE PLAYER ================= */
.inline-player{
  margin:0 0 22px 0;
  border-radius:14px;
  overflow:hidden;
  background:#000;
  position:relative;
  animation:playerIn .38s cubic-bezier(.22,.61,.36,1);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.inline-player[hidden]{display:none}
@keyframes playerIn{
  from{opacity:0;transform:translateY(-10px) scale(.97)}
  to{opacity:1;transform:none}
}
.inline-player-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}
.inline-player-frame iframe{
  position:absolute;inset:0;width:100%;height:100%;border:0;
}
.inline-close{
  position:absolute;top:10px;right:10px;z-index:5;
  width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.18);
  transition:transform .15s ease,background .2s;
}
.inline-close:active{transform:scale(.9);background:rgba(0,0,0,.85)}
.inline-close svg{
  width:13px;height:13px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;
}

/* ================= SERVER SWITCHER ================= */
.server-bar{
  display:flex;gap:6px;padding:10px 12px;
  overflow-x:auto;
  background:rgba(14,14,20,.94);
  border-top:1px solid rgba(255,255,255,.06);
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.server-bar::-webkit-scrollbar{display:none}
.server-chip{
  flex:0 0 auto;
  padding:7px 14px;border-radius:8px;
  font-size:11.5px;font-weight:700;letter-spacing:.15px;
  background:rgba(255,255,255,.06);color:#a0a0b0;
  border:1px solid rgba(255,255,255,.08);
  white-space:nowrap;
  transition:background .2s ease,color .2s ease,border-color .2s ease,transform .15s ease;
}
.server-chip:active{transform:scale(.94)}
.server-chip.active{
  background:#fff;color:#0a0a0d;border-color:#fff;
  box-shadow:0 2px 8px rgba(255,255,255,.18);
}

/* ================= POPUP SHIELD BADGE ================= */
.shield-badge{
  position:absolute;top:10px;left:10px;z-index:5;
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 9px 4px 7px;border-radius:999px;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(120,255,170,.35);
  color:#d8ffe5;
  font-size:9.5px;font-weight:750;letter-spacing:.3px;
  transition:transform .15s ease,background .2s,border-color .2s;
}
.shield-badge:active{transform:scale(.94);background:rgba(0,0,0,.85)}
.shield-badge .sb-icon{font-size:11px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.shield-badge .sb-text{opacity:.92}
.shield-badge.off{border-color:rgba(255,190,90,.4);color:#ffe4b5}

<script>
/* ╔══════════════════════════════════════════════════════════════════════╗
   ║                                                                      ║
   ║   ⬇⬇⬇   STEP 1: PUT YOUR TMDB API KEY ON THE NEXT LINE   ⬇⬇⬇       ║
   ║                                                                      ║
   ║   Get a free key here:  https://www.themoviedb.org/settings/api      ║
   ║                                                                      ║
   ╚══════════════════════════════════════════════════════════════════════╝ */

const TMDB_API_KEY = '5adcefa4f28acf78843a6bc42e7b5e2d';

/* ╔══════════════════════════════════════════════════════════════════════╗
   ║                                                                      ║
   ║   ⬇⬇⬇   STEP 2: ADD YOUR STREAMING EMBED SERVERS BELOW   ⬇⬇⬇       ║
   ║                                                                      ║
   ║   You can add as many servers as you like — they appear as pills     ║
   ║   under the video when you hit play. Users can swap servers if       ║
   ║   the current one is lagging. The "name" is what shows on the chip.  ║
   ║                                                                      ║
   ║   Placeholders {id}, {season}, {episode} are replaced at play time.  ║
   ║                                                                      ║
   ╚══════════════════════════════════════════════════════════════════════╝ */

const MOVIE_SERVERS = [
  { name: 'Server 1', url: 'https://cinesrc.st/embed/movie/{id}' },
  { name: 'Server 2', url: 'https://framextv.tech/embed/{id}?autoplay=1&muted=0' },
  { name: 'Server 3', url: 'https://fmov.my/embed/movie/{id}' },
  { name: 'Server 4', url: 'https://framextv.xyz/embed/{id}?autoplay=0&muted=0' },
];

const TV_SERVERS = [
  { name: 'Server 1', url: 'https://cinesrc.st/embed/tv/{id}?s={season}&e={episode}' },
  { name: 'Server 2', url: 'https://fmov.my/embed/series/{id}/{season}/{episode}' },
  { name: 'Server 3', url: 'https://framextv.xyz/embed/{id}/{season}/{episode}' },
  { name: 'Server 4', url: 'https://framextv.tech/embed/{id}/{season}/{episode}' },
];

/* ╔══════════════════════════════════════════════════════════════════════╗
   ║                                                                      ║
   ║   ⬇⬇⬇   STEP 3: POPUP BLOCKER (leave true for max protection)  ⬇⬇⬇  ║
   ║                                                                      ║
   ╚══════════════════════════════════════════════════════════════════════╝ */

const POPUP_SHIELD = true;

/* ╔══════════════════════════════════════════════════════════════════════╗
   ║   ⬆⬆⬆   THAT IS EVERYTHING YOU NEED TO CHANGE   ⬆⬆⬆                 ║
   ╚══════════════════════════════════════════════════════════════════════╝ */


/* =====================================================================
   EMBED URL BUILDERS  (server-index aware)
   ===================================================================== */
function buildMovieUrl(id, serverIdx = 0) {
  const server = MOVIE_SERVERS[serverIdx] || MOVIE_SERVERS[0];
  if (!server) return '';
  return server.url.replace(/\{id\}/g, encodeURIComponent(id));
}
function buildTVUrl(id, season, episode, serverIdx = 0) {
  const server = TV_SERVERS[serverIdx] || TV_SERVERS[0];
  if (!server) return '';
  return server.url
    .replace(/\{id\}/g, encodeURIComponent(id))
    .replace(/\{season\}/g, encodeURIComponent(season))
    .replace(/\{episode\}/g, encodeURIComponent(episode));
}

/* =====================================================================
   CONFIG
   ===================================================================== */
const API_BASE = 'https://api.themoviedb.org/3';
const IMG_BASE = 'https://image.tmdb.org/t/p/';
const TMDB_MAX_PAGE = 500;

const img   = (path, size = 'w500') => path ? IMG_BASE + size + path : '';
const $     = (s, r = document) => r.querySelector(s);
const $$    = (s, r = document) => [...r.querySelectorAll(s)];
const esc   = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt   = n => (Number(n) || 0).toFixed(1);

function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  } catch { return dateStr; }
}

/* =====================================================================
   LOADING SCREEN CONTROLLER
   ===================================================================== */
const loadStartTime = Date.now();
const MIN_LOAD_TIME = 1400;
let   loadProgress  = 0;
let   loadTimer     = null;
let   loadFinished  = false;

const loadingScreen  = $('#loadingScreen');
const loadingBarFill = $('#loadingBarFill');
const loadingStatus  = $('#loadingStatus');

function setLoadProgress(pct, statusText) {
  loadProgress = Math.max(loadProgress, Math.min(Number(pct) || 0, 100));
  if (loadingBarFill) loadingBarFill.style.width = loadProgress + '%';
  if (statusText && loadingStatus) loadingStatus.textContent = statusText;
}

function startLoadAnimation() {
  const steps = [
    [10, 'Connecting to TMDB…'],
    [22, 'Fetching trending…'],
    [36, 'Loading popular movies…'],
    [50, 'Loading TV shows…'],
    [64, 'Loading top rated…'],
    [76, 'Fetching genres…'],
    [88, 'Finishing up…'],
  ];
  let i = 0;
  const tick = () => {
    if (loadFinished) return;
    if (i >= steps.length) return;
    setLoadProgress(steps[i][0], steps[i][1]);
    i++;
    loadTimer = setTimeout(tick, 220 + Math.random() * 140);
  };
  tick();
}

function finishLoading(success = true) {
  if (loadFinished) return;
  loadFinished = true;
  clearTimeout(loadTimer);

  const elapsed = Date.now() - loadStartTime;
  const remaining = Math.max(0, MIN_LOAD_TIME - elapsed);

  setTimeout(() => {
    setLoadProgress(100, success ? 'Ready' : 'Setup required');
    if (loadingStatus) loadingStatus.classList.toggle('ready', success);

    setTimeout(() => {
      if (loadingScreen) {
        loadingScreen.classList.add('done');
        document.body.classList.remove('loading-active');
        setTimeout(() => {
          if (loadingScreen && loadingScreen.parentNode) loadingScreen.remove();
        }, 700);
      }
    }, success ? 420 : 750);
  }, remaining);
}

/* =====================================================================
   STATE
   ===================================================================== */
const state = {
  hero: null,
  trending: [],
  popularMovies: [],
  popularTV: [],
  topRated: [],
  genresMovie: [],
  genresTV: [],
  movieGenre: 'all',
  tvGenre: 'all',
  favs: [],
};

try { state.favs = JSON.parse(localStorage.getItem('reelix:favs') || '[]'); }
catch { state.favs = []; }

const saveFavs = () => {
  try { localStorage.setItem('reelix:favs', JSON.stringify(state.favs)); } catch {}
};

/* =====================================================================
   PLAYER CONTEXT (tracks what's playing + which server)
   ===================================================================== */
let currentPlayCtx   = null;   // { id, type, season, episode }
let currentServerIdx = 0;

/* =====================================================================
   PAGER
   ===================================================================== */
function makePager() {
  return { page:0, hasMore:true, loading:false, token:0, genre:'all', ids:new Set() };
}
const moviePager = makePager();
const tvPager    = makePager();

/* =====================================================================
   TMDB FETCH
   ===================================================================== */
async function api(path, params = {}) {
  const url = new URL(API_BASE + path);
  url.searchParams.set('api_key', TMDB_API_KEY);
  url.searchParams.set('language', 'en-US');
  for (const [k, v] of Object.entries(params)) {
    if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v);
  }
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error('TMDB ' + res.status);
  return res.json();
}

/* =====================================================================
   NORMALIZER
   ===================================================================== */
function norm(raw, forceType) {
  const type = forceType || raw.media_type || (raw.first_air_date ? 'tv' : 'movie');
  return {
    id: raw.id,
    type,
    title: raw.title || raw.name || 'Untitled',
    year: (raw.release_date || raw.first_air_date || '').slice(0, 4),
    rating: raw.vote_average || 0,
    poster_path: raw.poster_path || null,
    backdrop_path: raw.backdrop_path || null,
    overview: raw.overview || '',
    genre_ids: raw.genre_ids || (raw.genres || []).map(g => g.id),
  };
}

const isFav = (id, type) => state.favs.some(f => f.id === id && f.type === type);

function genreName(id, type) {
  const list = type === 'tv' ? state.genresTV : state.genresMovie;
  const g = list.find(x => x.id === id);
  return g ? g.name : '';
}

/* =====================================================================
   TOAST
   ===================================================================== */
let toastTimer;
function toast(msg, ms = 1700) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* =====================================================================
   MARKUP HELPERS
   ===================================================================== */
function cardHTML(item) {
  const poster = img(item.poster_path, 'w342');
  const on = isFav(item.id, item.type);
  return `<button class="card" data-open="${item.id}" data-type="${item.type}">
    <div class="poster">
      <span class="ph">🎬</span>
      ${poster ? `<img src="${poster}" alt="${esc(item.title)}" loading="lazy" decoding="async" onerror="this.remove()">` : ''}
      <span class="rate">★ ${fmt(item.rating)}</span>
      ${on ? '<span class="fav-mark">♥</span>' : ''}
    </div>
    <div class="c-title">${esc(item.title)}</div>
    <div class="c-meta">${item.year || '—'}</div>
  </button>`;
}

function rowHTML(title, items) {
  if (!items || !items.length) return '';
  return `<section class="row">
    <div class="row-head"><h3>${esc(title)}</h3><span>See all</span></div>
    <div class="hscroll">${items.map(cardHTML).join('')}</div>
  </section>`;
}

const skeletonCards = (n = 9) =>
  Array.from({ length: n }, () =>
    `<div><div class="sk-poster"></div><div class="sk-line"></div><div class="sk-line short"></div></div>`
  ).join('');

const emptyHTML = (msg, sub = '') => `<div class="empty">
  <div class="ico">🔍</div><h4>${esc(msg)}</h4>${sub ? `<p>${esc(sub)}</p>` : ''}
</div>`;

const errorHTML = (msg = 'Something went wrong.') => `<div class="empty">
  <div class="ico">⚠️</div><h4>${esc(msg)}</h4><p>Check your API key and internet connection, then reload.</p>
</div>`;

/* =====================================================================
   HOME
   ===================================================================== */
function renderHome() {
  const feat = state.trending.find(x => x.backdrop_path) || state.trending[0];
  if (!feat) return;
  state.hero = feat;

  const bg = img(feat.backdrop_path, 'w780') || img(feat.poster_path, 'w780');
  const names = (feat.genre_ids || []).map(id => genreName(id, feat.type)).filter(Boolean).slice(0, 2).join(' · ');
  const on = isFav(feat.id, feat.type);

  $('#home-hero').innerHTML = `
    <section class="hero">
      ${bg ? `<img class="hero-img" src="${bg}" alt="" onerror="this.remove()">` : ''}
      <div class="hero-body">
        <span class="hero-tag">🔥 Trending this week</span>
        <h1>${esc(feat.title)}</h1>
        <div class="hero-meta">
          ${feat.year ? `<span>${feat.year}</span><span class="dot"></span>` : ''}
          <span>${esc(names) || (feat.type === 'tv' ? 'TV Series' : 'Movie')}</span>
          <span class="dot"></span>
          <span class="star">★ ${fmt(feat.rating)}</span>
        </div>
        <div class="hero-actions">
          <button class="btn-main" data-play-id="${feat.id}" data-play-type="${feat.type}">
            <svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg> Watch Now
          </button>
          <button class="btn-round ${on ? 'on' : ''}" id="heroFav" aria-label="Favorite">
            <svg viewBox="0 0 24 24"><path d="M12 20.2s-7.4-4.6-7.4-9.4A4.1 4.1 0 0 1 12 7.8a4.1 4.1 0 0 1 7.4 3c0 4.8-7.4 9.4-7.4 9.4z"/></svg>
          </button>
        </div>
      </div>
    </section>`;

  $('#home-rows').innerHTML =
    rowHTML('Trending This Week', state.trending) +
    rowHTML('Popular Movies', state.popularMovies) +
    rowHTML('Binge-Worthy Series', state.popularTV) +
    rowHTML('Top Rated', state.topRated);
}

/* =====================================================================
   GENRE CHIPS
   ===================================================================== */
function renderChips(el, genres, active, onPick) {
  if (!el) return;

  const scrollPos = el.scrollLeft;

  el.innerHTML =
    `<button class="chip ${active === 'all' ? 'active' : ''}" data-g="all">All</button>` +
    genres.map(g =>
      `<button class="chip ${String(g.id) === String(active) ? 'active' : ''}" data-g="${g.id}">${esc(g.name)}</button>`
    ).join('');

  el.scrollLeft = scrollPos;

  el.onclick = e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    el.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === b));
    onPick(b.dataset.g);
  };
}

/* =====================================================================
   PAGER HELPERS
   ===================================================================== */
function resetPager(p, genre) {
  p.token++;
  p.page = 0;
  p.hasMore = true;
  p.loading = false;
  p.genre = genre;
  p.ids = new Set();
}

function fetchMoviePage(page, genre) {
  if (genre === 'all') return api('/movie/popular', { page });
  return api('/discover/movie', { with_genres: genre, sort_by: 'popularity.desc', page });
}

function fetchTVPage(page, genre) {
  if (genre === 'all') return api('/tv/popular', { page });
  return api('/discover/tv', { with_genres: genre, sort_by: 'popularity.desc', page });
}

/* =====================================================================
   MOVIES
   ===================================================================== */
function initMovies() {
  const onGenrePick = g => {
    if (g === state.movieGenre) return;
    state.movieGenre = g;
    $('#movie-grid').innerHTML = skeletonCards(9);
    $('#movie-sentinel').innerHTML = '';
    resetPager(moviePager, g);
    loadMoreMovies();
  };

  renderChips($('#movie-chips'), state.genresMovie, state.movieGenre, onGenrePick);

  $('#movie-grid').innerHTML = skeletonCards(9);
  $('#movie-sentinel').innerHTML = '';
  resetPager(moviePager, state.movieGenre);
  loadMoreMovies();
}

async function loadMoreMovies() {
  const p = moviePager;
  if (p.loading || !p.hasMore) return;

  p.loading = true;
  const token = p.token;
  const nextPage = p.page + 1;
  const grid = $('#movie-grid');
  const sentinel = $('#movie-sentinel');

  if (nextPage > 1) sentinel.innerHTML = '<div class="spinner"></div>';

  try {
    const d = await fetchMoviePage(nextPage, p.genre);
    if (token !== p.token) return;

    const items = (d.results || []).map(r => norm(r, 'movie')).filter(it => {
      if (p.ids.has(it.id)) return false;
      p.ids.add(it.id);
      return true;
    });

    p.page = d.page || nextPage;
    const total = Math.min(d.total_pages || 1, TMDB_MAX_PAGE);
    p.hasMore = p.page < total && items.length > 0;

    if (nextPage === 1) {
      grid.innerHTML = items.length ? items.map(cardHTML).join('') : emptyHTML('No movies in this genre');
    } else {
      grid.insertAdjacentHTML('beforeend', items.map(cardHTML).join(''));
    }

    sentinel.innerHTML = p.hasMore ? '' : '<div class="end-note">You’ve reached the end</div>';
  } catch {
    if (token !== p.token) return;
    sentinel.innerHTML = `<button class="retry-btn" data-retry="movie">Failed — tap to retry</button>`;
  } finally {
    if (token === p.token) p.loading = false;
  }
}

function initTV() {
  const onGenrePick = g => {
    if (g === state.tvGenre) return;
    state.tvGenre = g;
    $('#tv-grid').innerHTML = skeletonCards(9);
    $('#tv-sentinel').innerHTML = '';
    resetPager(tvPager, g);
    loadMoreTV();
  };

  renderChips($('#tv-chips'), state.genresTV, state.tvGenre, onGenrePick);

  $('#tv-grid').innerHTML = skeletonCards(9);
  $('#tv-sentinel').innerHTML = '';
  resetPager(tvPager, state.tvGenre);
  loadMoreTV();
}

async function loadMoreTV() {
  const p = tvPager;
  if (p.loading || !p.hasMore) return;

  p.loading = true;
  const token = p.token;
  const nextPage = p.page + 1;
  const grid = $('#tv-grid');
  const sentinel = $('#tv-sentinel');

  if (nextPage > 1) sentinel.innerHTML = '<div class="spinner"></div>';

  try {
    const d = await fetchTVPage(nextPage, p.genre);
    if (token !== p.token) return;

    const items = (d.results || []).map(r => norm(r, 'tv')).filter(it => {
      if (p.ids.has(it.id)) return false;
      p.ids.add(it.id);
      return true;
    });

    p.page = d.page || nextPage;
    const total = Math.min(d.total_pages || 1, TMDB_MAX_PAGE);
    p.hasMore = p.page < total && items.length > 0;

    if (nextPage === 1) {
      grid.innerHTML = items.length ? items.map(cardHTML).join('') : emptyHTML('No shows in this genre');
    } else {
      grid.insertAdjacentHTML('beforeend', items.map(cardHTML).join(''));
    }

    sentinel.innerHTML = p.hasMore ? '' : '<div class="end-note">You’ve reached the end</div>';
  } catch {
    if (token !== p.token) return;
    sentinel.innerHTML = `<button class="retry-btn" data-retry="tv">Failed — tap to retry</button>`;
  } finally {
    if (token === p.token) p.loading = false;
  }
}

/* =====================================================================
   INFINITE SCROLL
   ===================================================================== */
function setupInfiniteScroll() {
  const watch = (el, cb) => {
    if (!('IntersectionObserver' in window)) {
      window.addEventListener('scroll', () => {
        const r = el.getBoundingClientRect();
        if (r.top < window.innerHeight + 500) cb();
      }, { passive: true });
      return;
    }
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) cb(); });
    }, { root: null, rootMargin: '500px 0px', threshold: 0 });
    io.observe(el);
  };

  watch($('#movie-sentinel'), loadMoreMovies);
  watch($('#tv-sentinel'),    loadMoreTV);
}

function toggleFav(item) {
  if (!item) return;
  const i = state.favs.findIndex(f => f.id === item.id && f.type === item.type);

  if (i > -1) {
    state.favs.splice(i, 1);

    state.favs.unshift({ ...item });

  saveFavs();

  if ($('#view-favorites').classList.contains('active')) renderFavorites();

function syncFavMarks(id, type) {
  const on = isFav(id, type);

  $$(`.card[data-open="${id}"][data-type="${type}"]`).forEach(c => {
    const p = c.querySelector('.poster');

/* =====================================================================
   SEASONS & EPISODES
   ===================================================================== */
function setupSeasons(seriesId, seasons) {
  const chipsEl = $('#season-chips');
  const listEl  = $('#episode-list');
  if (!chipsEl || !listEl) return;

  let usable = seasons.filter(s => s.season_number > 0 && (s.episode_count || 0) > 0);
  if (!usable.length) usable = seasons.filter(s => (s.episode_count || 0) > 0);
  if (!usable.length) usable = seasons;

  if (!usable.length) {
    listEl.innerHTML = `<div class="ep-empty">No seasons available.</div>`;
    return;
  }

  chipsEl.innerHTML = usable.map(s =>
    `<button class="chip" data-season="${s.season_number}">Season ${s.season_number}</button>`
  ).join('');

  chipsEl.onclick = e => {
    const chip = e.target.closest('[data-season]');
    if (!chip) return;
    chipsEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
    loadSeasonEpisodes(seriesId, Number(chip.dataset.season), chipsEl, listEl);
  };

  listEl.onclick = e => {
    const ep = e.target.closest('.episode');
    if (!ep) return;
    playTV(Number(ep.dataset.epid), Number(ep.dataset.season), Number(ep.dataset.epnum));
  };

  loadSeasonEpisodes(seriesId, usable[0].season_number, chipsEl, listEl);
}

async function loadSeasonEpisodes(seriesId, seasonNumber, chipsEl, listEl) {
  $$('.chip', chipsEl).forEach(c => {
    c.classList.toggle('active', Number(c.dataset.season) === seasonNumber);
  });

  const countEl = $('#epCount');
  if (countEl) countEl.textContent = `· Season ${seasonNumber}`;

  listEl.innerHTML = `<div style="display:grid;place-items:center;padding:26px"><div class="spinner"></div></div>`;

  try {
    const d = await api(`/tv/${seriesId}/season/${seasonNumber}`);
    const episodes = d.episodes || [];

    if (countEl) {
      countEl.textContent = `· Season ${seasonNumber} · ${episodes.length} episode${episodes.length !== 1 ? 's' : ''}`;
    }

    if (!episodes.length) {
      listEl.innerHTML = `<div class="ep-empty">No episodes in this season.</div>`;
      return;
    }

    listEl.innerHTML = `<div class="episode-list">${episodes.map(ep => {
      const epNum = ep.episode_number || 0;
      const epName = ep.name || `Episode ${epNum}`;
      const still = ep.still_path ? img(ep.still_path, 'w300') : '';
      const date  = formatDate(ep.air_date);
      const runtime = ep.runtime ? ` · ${ep.runtime}m` : '';
      const meta = (date || '—') + runtime;

      return `<button class="episode"
                     data-epid="${seriesId}"
                     data-season="${seasonNumber}"
                     data-epnum="${epNum}">
        <div class="ep-thumb">
          ${still ? `<img src="${still}" alt="" loading="lazy" onerror="this.remove()">` : ''}
          <span class="ep-num-badge">E${epNum}</span>
        </div>
        <div class="ep-info">
          <div class="ep-title">${esc(epName)}</div>
          <div class="ep-meta">${esc(meta)}</div>
          ${ep.overview ? `<div class="ep-overview">${esc(ep.overview)}</div>` : ''}
        </div>
      </button>`;
    }).join('')}</div>`;
  } catch {
    if (countEl) countEl.textContent = '';
    listEl.innerHTML = `<div class="ep-empty">Could not load episodes. Tap a season to retry.</div>`;
  }
}

/* =====================================================================
   INLINE PLAYER  +  SERVER SWITCHER
   ===================================================================== */
let firstPlayToastShown = false;

function playContent(id, type, season = 1, episode = 1) {
  if (!id) { toast('No source available'); return; }

  const wrap  = $('#inlinePlayer');
  const frame = $('#embedFrame');
  if (!wrap || !frame) { toast('Player not ready'); return; }

  /* ─────────────────────────────────────────────────────────────
     Preserve the current server across episode switches.
     stopInline() (called on close / new title) resets the index
     to 0, so a fresh open always starts at Server 1 — but tapping
     a different episode keeps you on whichever server you chose.
     Clamp defensively in case the new type has fewer servers.
     ───────────────────────────────────────────────────────────── */
  const servers = type === 'tv' ? TV_SERVERS : MOVIE_SERVERS;
  if (!currentPlayCtx) currentServerIdx = 0;
  if (currentServerIdx < 0 || currentServerIdx >= servers.length) currentServerIdx = 0;

  currentPlayCtx = { id, type, season, episode };

  const url = type === 'tv'
    ? buildTVUrl(id, season, episode, currentServerIdx)
    : buildMovieUrl(id, currentServerIdx);

  if (!url) { toast('Server not available'); return; }

  frame.src = url;
  wrap.hidden = false;
  updateServerBar();

  setTimeout(() => {
    try {
      wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (_) {
      const r = wrap.getBoundingClientRect();
      if (r.top < 0 || r.bottom > window.innerHeight) {
        wrap.scrollIntoView({ block: 'center' });
      }
    }
  }, 40);

  if (POPUP_SHIELD && !firstPlayToastShown) {
    firstPlayToastShown = true;
    setTimeout(() => toast('🛡️ Pop-up protection active', 2200), 600);
  }
}

/* Swap to a different server for the currently playing content */
function loadServer(idx) {
  if (!currentPlayCtx) return;

  const frame = $('#embedFrame');
  if (!frame) return;

  const { id, type, season, episode } = currentPlayCtx;
  const servers = type === 'tv' ? TV_SERVERS : MOVIE_SERVERS;
  if (idx < 0 || idx >= servers.length) return;

  const url = type === 'tv'
    ? buildTVUrl(id, season, episode, idx)
    : buildMovieUrl(id, idx);

  if (!url) { toast('Server not available'); return; }

  currentServerIdx = idx;
  frame.src = url;
  updateServerBar();
}

/* Render the server pills inside the player */
function updateServerBar() {
  const bar = $('#serverBar');
  if (!bar || !currentPlayCtx) return;

  const servers = currentPlayCtx.type === 'tv' ? TV_SERVERS : MOVIE_SERVERS;

  bar.innerHTML = servers.map((s, i) =>
    `<button class="server-chip ${i === currentServerIdx ? 'active' : ''}" data-server="${i}">${esc(s.name)}</button>`
  ).join('');
}

function stopInline() {
  const wrap  = $('#inlinePlayer');
  const frame = $('#embedFrame');
  if (wrap)  wrap.hidden = true;
  if (frame) frame.src = '';
  currentPlayCtx   = null;
  currentServerIdx = 0;   // ← reset to Server 1 when the player closes
}

/* Public wrappers (keep existing call sites working) */
function playMovie(id) { playContent(id, 'movie', 1, 1); }
function playTV(id, season = 1, episode = 1) { playContent(id, 'tv', season, episode); }

function closeDetail() {
  stopInline();
  sheet.classList.remove('open');
  currentItem = null;
  document.body.classList.remove('locked');
}

/* =====================================================================
   POPUP SHIELD (parent-level guards)
   ===================================================================== */
function setupPopupShield() {
  try {
    const original = window.open;
    window.open = function (...args) {
      console.warn('[Reelix shield] window.open blocked →', args[0]);
      toast('🛡️ Pop-up blocked');
      return null;
    };
    window.__reelixOriginalOpen = original;
  } catch (_) {}

  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[target="_blank"]');
    if (a && !a.hasAttribute('data-allow-popup')) {
      e.preventDefault();
      e.stopPropagation();
      toast('🛡️ Pop-up blocked');
    }
  }, true);
}

/* =====================================================================
   NAVIGATION
   ===================================================================== */
const VIEWS = {
  home: '#view-home',
  movies: '#view-movies',
  tv: '#view-tv',
  favorites: '#view-favorites',
  search: '#view-search'
};

function go(name) {
  $$('.view').forEach(v => v.classList.remove('active'));
  $(VIEWS[name]).classList.add('active');
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  window.scrollTo(0, 0);

  if (name === 'favorites') renderFavorites();
  if (name === 'search' && !$('#search-body').children.length) renderSearchIdle();

  if (name === 'movies' || name === 'tv') {
    requestAnimationFrame(() => {
      const sel = name === 'movies' ? '#movie-sentinel' : '#tv-sentinel';
      const el = $(sel);
      if (!el) return;
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight + 500) {
        name === 'movies' ? loadMoreMovies() : loadMoreTV();
      }
    });
  }
}

/* =====================================================================
   GLOBAL CLICK HANDLER
   ===================================================================== */
document.addEventListener('click', e => {

  const tab = e.target.closest('[data-tab]');
  if (tab) { go(tab.dataset.tab); return; }

  if (e.target.closest('#sheetClose')) { closeDetail(); return; }

  const retry = e.target.closest('[data-retry]');
  if (retry) {
    if (retry.dataset.retry === 'movie') loadMoreMovies();
    else loadMoreTV();
    return;
  }

  const card = e.target.closest('.card[data-open]');
  if (card) {
    openDetail(Number(card.dataset.open), card.dataset.type);
    return;
  }

  if (e.target.closest('#heroFav')) { toggleFav(state.hero); return; }
  if (e.target.closest('[data-fav-sheet]')) { toggleFav(currentItem); return; }

  if (e.target.closest('#inlineClose')) { stopInline(); return; }

  /* Server chip tap */
  const serverChip = e.target.closest('.server-chip[data-server]');
  if (serverChip) {
    loadServer(Number(serverChip.dataset.server));
    return;
  }

  if (e.target.closest('#shieldBadge')) {
    toast(POPUP_SHIELD
      ? '🛡️ Pop-ups & top-redirects blocked while playing'
      : '⚠️ Pop-up shield is OFF — set POPUP_SHIELD = true to re-enable',
      2400);
    return;
  }

  const playBtn = e.target.closest('[data-play-id]');
  if (playBtn) {
    const id   = Number(playBtn.dataset.playId);
    const type = playBtn.dataset.playType;

    if (playBtn.closest('#sheetScroll')) {
      playContent(id, type);
    } else {
      openDetail(id, type, true);
    }
    return;
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (sheet.classList.contains('open')) closeDetail();
});

/* =====================================================================
   KEY / URL BANNER
   ===================================================================== */
function showConfigBanner() {
  const missingKey  = !TMDB_API_KEY || TMDB_API_KEY === 'PASTE_YOUR_TMDB_API_KEY_HERE';
  const allServers  = [...MOVIE_SERVERS, ...TV_SERVERS];
  const missingUrls = allServers.some(s => !s.url || s.url.includes('your-free-website.com'));

  if (missingKey || missingUrls) {
    const parts = [];
    if (missingKey)  parts.push('<b>TMDB API key missing</b>');
    if (missingUrls) parts.push('<b>Embed server URLs not configured</b>');
    document.body.insertAdjacentHTML('afterbegin', `
      <div class="key-banner">
        ⚠️ ${parts.join(' · ')}<br>
        Open this file → JavaScript section → edit the lines under
        <b>STEP 1</b> and <b>STEP 2</b>.
      </div>`);
  }
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  startLoadAnimation();

  showConfigBanner();
  setupPopupShield();

  if (!TMDB_API_KEY || TMDB_API_KEY === 'PASTE_YOUR_TMDB_API_KEY_HERE') {
    $('#home-hero').innerHTML = '';
    $('#home-rows').innerHTML = errorHTML('Add your TMDB API key to start.');
    finishLoading(false);
    return;
  }

  $('#home-hero').innerHTML = `<div class="hero-skeleton"></div>`;
  $('#home-rows').innerHTML = `
    <section class="row"><div class="row-head"><h3>Loading…</h3></div>
      <div class="hscroll">${skeletonCards(4)}</div></section>`;

  try {
    const [trending, popM, popT, topR, gm, gt] = await Promise.all([
      api('/trending/all/week'),
      api('/movie/popular'),
      api('/tv/popular'),
      api('/movie/top_rated'),
      api('/genre/movie/list'),
      api('/genre/tv/list'),
    ]);

    state.trending = trending.results
      .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
      .map(r => norm(r));

    state.popularMovies = popM.results.map(r => norm(r, 'movie'));
    state.popularTV     = popT.results.map(r => norm(r, 'tv'));
    state.topRated      = topR.results.map(r => norm(r, 'movie'));
    state.genresMovie   = gm.genres;
    state.genresTV      = gt.genres;

    renderHome();
    initMovies();
    initTV();
    setupInfiniteScroll();
    renderSearchIdle();

    finishLoading(true);
  } catch (err) {
    console.error(err);
    $('#home-hero').innerHTML = '';
    $('#home-rows').innerHTML = errorHTML('Could not reach TMDB. Verify your API key.');
    finishLoading(false);
  }
}

boot();
</script>
</body>
</html>
